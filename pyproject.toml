[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"


[project]
name = "projectstarter"
version = "0.1.0"
description = "A Python CLI tool for quickly generating Python, Django, Flask, and FastAPI projects"
readme = "README.md"
requires-python = ">=3.9"

authors = [
    { name = "Mohamed Ali", email = "mohamedali32947@gmail.com" }
]

license = "MIT"
license-files = ["LICENSE*"]

keywords = [
    "cli",
    "project-generator",
    "project-starter",
    "python",
    "django",
    "flask",
    "fastapi"
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Build Tools",
]


[project.scripts]
projectstarter = "projectstarter.cli:main"


[project.urls]
Homepage = "https://github.com/hamada-cool/projectstarter"
Repository = "https://github.com/hamada-cool/projectstarter"
Issues = "https://github.com/hamada-cool/projectstarter/issues"


[tool.setuptools.packages.find]
include = ["projectstarter*"]